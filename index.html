:root{
  color-scheme: light;
  --bg:#f3f5f1; --surface:#fbfcfa; --ink:#18201b; --ink-2:#4f5a53; --muted:#7b857e;
  --line:#dde2dc; --grid:#e8ece6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --accent:#256abf; --tag:#e7eee6;
  --good:#0ca30c; --warn:#fab219;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --h-lo:#b7d3f6; --h-lo-ink:#104281; --h-ok:#eceeea; --h-hi:#f5c0bf; --h-hi-ink:#8a1f1e;
  --ref:#6b746d; --in:#1baf7a; --out:#eb6834;
  --g-ok:#cfeccf; --g-ok-ink:#0f5c0f; --g-mid:#fbe7b5; --g-mid-ink:#6b4a00; --g-ng:#f5c0bf; --g-ng-ink:#8a1f1e;
}

  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121614; --surface:#1a1f1c; --ink:#eef2ed; --ink-2:#c1c9c2; --muted:#8d978f;
    --line:#2d3530; --grid:#262d29; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --accent:#6da7ec; --tag:#242b27;

  }
}

  color-scheme: dark;
  --bg:#121614; --surface:#1a1f1c; --ink:#eef2ed; --ink-2:#c1c9c2; --muted:#8d978f;
  --line:#2d3530; --grid:#262d29; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --accent:#6da7ec; --tag:#242b27;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","IPAPGothic","Yu Gothic",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:28px}
header{display:grid;gap:6px}
header h1{font-size:26px;line-height:1.3;margin:0;letter-spacing:.02em;text-wrap:balance}
.meta{color:var(--ink-2);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px}
.pill{display:inline-block;background:var(--tag);color:var(--ink-2);border-radius:999px;padding:1px 10px;font-size:12px}
.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,"Noto Sans Mono CJK JP",monospace;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.tile .k{font-size:12px;color:var(--ink-2);letter-spacing:.04em}
.tile .v{font-size:24px;line-height:1.25}
.tile .s{font-size:12px;color:var(--muted)}
section{display:grid;gap:12px}
section>h2{font-size:17px;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
section>h2 small{font-weight:400;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 8px;display:grid;gap:4px;min-width:0;align-content:start}
.card h3{font-size:14px;margin:0}
.card .sub{font-size:12px;color:var(--muted);margin:0}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text.reflab{fill:var(--ref);font-size:10.5px;font-family:inherit;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart text{fill:var(--muted);font-size:11px;font-family:"IBM Plex Mono",ui-monospace,Menlo,"Noto Sans Mono CJK JP",monospace}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);top:0}
.empty{font-size:13px;color:var(--muted);padding:18px 0 14px}
.notes{display:grid;gap:8px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
.note b{font-family:"IBM Plex Mono",ui-monospace,Menlo,"Noto Sans Mono CJK JP",monospace;font-weight:500;color:var(--ink-2);margin-right:8px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-size:14px}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;font-size:12px}
th,td{padding:4px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th{color:var(--ink-2);font-weight:700;position:sticky;top:0;background:var(--surface)}
td:first-child,th:first-child{text-align:left}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar span.b{height:10px;border-radius:0 4px 4px 0;background:var(--s1)}
.grid.dense{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.legend i.sq{width:10px;height:10px;border-radius:2px}
.tip i.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
table.heat td{text-align:center;font-size:11px;padding:5px 6px;border:2px solid var(--surface);border-radius:4px}
table.heat th{text-align:left}
table.heat thead th{text-align:center}
table.heat td.lo{background:var(--h-lo);color:var(--h-lo-ink)}
table.heat td.ok{background:var(--h-ok);color:var(--ink-2)}
table.heat td.hi{background:var(--h-hi);color:var(--h-hi-ink)}
table.heat td.gok{background:var(--g-ok);color:var(--g-ok-ink)}
table.heat td.gmid{background:var(--g-mid);color:var(--g-mid-ink)}
table.heat td.gng{background:var(--g-ng);color:var(--g-ng-ink)}
table.heat td.gna{color:var(--muted)}
.guide-note{font-size:12px;color:var(--muted);margin:8px 0 0;display:grid;gap:2px}
.meals{display:grid;gap:10px;margin-top:8px}
.meal .mh{display:flex;justify-content:space-between;font-weight:700;font-size:13px;border-bottom:1px solid var(--grid);padding-bottom:2px}
.meal ul{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px}
.meal li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;font-size:13px}
.meal li .it{min-width:0;overflow-wrap:anywhere}
.chip{font-size:10.5px;padding:0 7px;border-radius:999px;border:1px solid var(--cc);color:var(--ink-2);white-space:nowrap}
.chip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cc);margin-right:4px;vertical-align:1px}
details summary b{margin-right:6px}
.x .wrap{max-width:none;width:1080px;padding-inline:36px;padding-block:32px 28px;gap:22px}
.x body,.x{font-size:17px}
.x header h1{font-size:34px}
.x .grid{grid-template-columns:repeat(2,1fr);gap:16px}
.x .tiles{grid-template-columns:repeat(4,1fr)}
.x .tile .v{font-size:30px}
.x .tile .k,.x .tile .s{font-size:14px}
.x .grid.dense{grid-template-columns:repeat(3,1fr)}
.x .card h3{font-size:18px}
.x .card .sub,.x .legend{font-size:14px}
.x .chart text{font-size:13px}
.x section>h2{font-size:22px}
.x table.heat{width:100%}
.x #sec-time .grid{grid-template-columns:1fr}
.x #sec-indicators .grid{grid-template-columns:repeat(3,1fr)}
.x .guide-note{font-size:14px}
.x table.heat td{font-size:14px;padding:7px 10px}
.x table.heat th{font-size:14px}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>

  const NS="http://www.w3.org/2000/svg",s=document.createElementNS(NS,"svg");

  const every=Math.max(1,Math.ceil(n/7));
  D.forEach((r,i)=>{if((i%every===0&&(n-1-i>=every||i===n-1))||i===n-1){const t=g("text",{x:x(i),y:H-6,"text-anchor":"middle"});t.textContent=md(r.date)}});

    let d="",pen=false,py=null;D.forEach((r,i)=>{const v=num(r[se.key]);if(v==null){pen=false;return}d+=(pen?(se.step?`L${x(i)},${py}L`:"L"):"M")+x(i)+","+y(v);py=y(v);pen=true});

    if(!se.dash)D.forEach((r,i)=>{const v=num(r[se.key]);if(v!=null)g("circle",{cx:x(i),cy:y(v),r:3.5,fill:col,stroke:css("--surface"),"stroke-width":2})});

  refs.filter(rf=>rf.v>=lo&&rf.v<=hi).forEach(rf=>{const yy=y(rf.v);g("line",{x1:m.l,x2:W-m.r,y1:yy,y2:yy,stroke:css(rf.color||"--ref"),"stroke-width":1.5,"stroke-dasharray":"6 4"});

  const move=ev=>{const b=s.getBoundingClientRect(),px=(ev.clientX-b.left)/b.width*W;const i=Math.max(0,Math.min(n-1,Math.round((px-m.l)/(iw/(Math.max(1,n-1))))));

function stacked(el,{series,unit="",dec=0,max}){
  const W=Math.max(220,Math.round(el.clientWidth||320)),H=190,m={l:44,r:10,t:12,b:24},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const tot=D.map(r=>series.reduce((a,s)=>a+(num(r[s.key])||0),0));
  if(!tot.some(v=>v>0)){el.append($("div",{class:"empty"},"まだ記録がありません"));return}
  let hi=max||Math.max(...tot)*1.08;const step=(()=>{const r=hi/4,p=Math.pow(10,Math.floor(Math.log10(r)));return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=r)})();if(!max)hi=Math.ceil(hi/step)*step;
  const n=D.length,bw=Math.max(6,Math.min(26,iw/n*.62)),x=i=>m.l+(i+.5)*iw/n,y=v=>m.t+ih-v/hi*ih;
  const NS="http://www.w3.org/2000/svg",s=document.createElementNS(NS,"svg");s.setAttribute("viewBox",`0 0 ${W} ${H}`);s.setAttribute("role","img");
  const g=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);s.append(e);return e};
  const d0=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  for(let v=0;v<=hi+1e-9;v+=step){g("line",{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:css("--grid"),"stroke-width":1});const t=g("text",{x:m.l-6,y:y(v)+3,"text-anchor":"end"});t.textContent=v>=1000?fmt(v/1000,1)+"k":fmt(v,d0)}
  const every=Math.max(1,Math.ceil(n/7));D.forEach((r,i)=>{if((i%every===0&&(n-1-i>=every||i===n-1))||i===n-1){const t=g("text",{x:x(i),y:H-6,"text-anchor":"middle"});t.textContent=md(r.date)}});
  D.forEach((r,i)=>{let acc=0;const segs=series.map(se=>({se,v:num(r[se.key])||0})).filter(o=>o.v>0);
    segs.forEach((o,j)=>{const y0=y(acc),y1=y(acc+o.v);acc+=o.v;const top=j===segs.length-1,hgt=Math.max(0,y0-y1-(top?0:2)),rr=top?Math.min(4,hgt,bw/2):0,x0=x(i)-bw/2,yt=y0-hgt;
      g("path",{d:`M${x0},${y0}V${yt+rr}q0,-${rr} ${rr},-${rr}H${x0+bw-rr}q${rr},0 ${rr},${rr}V${y0}Z`,fill:css(o.se.color)})})});
  const cross=g("rect",{y:m.t,height:ih,width:iw/n,fill:css("--muted"),opacity:0});
  const hit=g("rect",{x:m.l,y:0,width:iw,height:H,fill:"transparent"});el.append(s);const tip=$("div",{class:"tip",hidden:""});el.append(tip);
  hit.addEventListener("pointermove",ev=>{const b=s.getBoundingClientRect(),px=(ev.clientX-b.left)/b.width*W,i=Math.max(0,Math.min(n-1,Math.floor((px-m.l)/(iw/n))));

    tip.replaceChildren($("div",{},md(D[i].date)+"  計 ",$("span",{class:"num"},fmt(tot[i],dec)+unit)),...series.filter(se=>num(D[i][se.key])).map(se=>$("div",{},$("i",{class:"sw",style:`background:var(${se.color})`}),se.label+"  ",$("span",{class:"num"},fmt(num(D[i][se.key]),dec)+unit))));
    tip.hidden=false;tip.style.left=(x(i)/W*100)+"%";tip.style.top=(m.t/H*b.height)+"px"});
  hit.addEventListener("pointerleave",()=>{tip.hidden=true;cross.setAttribute("opacity",0)});
}
function scard(title,sub,series,opt={}){

  const c=$("div",{class:"card"},$("h3",{},title));if(sub)c.append($("p",{class:"sub"},sub));
  c.append($("div",{class:"legend"},series.map(s=>$("span",{},$("i",{class:"sq",style:`background:var(${s.color})`}),s.label))));
  const ch=$("div",{class:"chart"});c.append(ch);requestAnimationFrame(()=>stacked(ch,{series,...opt}));return c}
function card(title,sub,series,opt={}){
  if(XC&&!series.some(s=>has(s.key)))return null;
  if(series.some(s=>has(s.key)))series=series.filter(s=>has(s.key));

  const ch=$("div",{class:"chart"});c.append(ch);requestAnimationFrame(()=>line(ch,{series,...opt}));return c}
